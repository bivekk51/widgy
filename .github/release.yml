changelog:
  categories:
    - title: "✨ Features & Enhancements"
      labels:
        - "feature"
        - "enhancement"
        - "feat"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
        - "bugfix"
    - title: "⚡ Performance Improvements"
      labels:
        - "performance"
        - "perf"
    - title: "🚀 Build & CI/CD"
      labels:
        - "ci"
        - "build"
    - title: "♻️ Refactoring & Cleanups"
      labels:
        - "refactor"
        - "cleanup"
