name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (for manual runs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Keystore Secret
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/widgy-release.jks

      - name: Test & Build Signed Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: signing/widgy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Test & Build Debug APK (Fallback)
        if: steps.check_keystore.outputs.has_keystore != 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare APK File
        run: |
          mkdir -p release-artifacts
          TAG_OR_REF="${{ github.ref_name }}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Widgy-${TAG_OR_REF}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Widgy-${TAG_OR_REF}.apk"
          fi

      - name: Clean Keystore
        if: always()
        run: rm -f signing/widgy-release.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Widgy-APK
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Generate Detailed Changelog
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        run: |
          mkdir -p release-artifacts
          CHANGELOG_FILE="release-artifacts/RELEASE_CHANGELOG.md"
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

          echo "## Release $TAG_NAME" > "$CHANGELOG_FILE"
          echo "" >> "$CHANGELOG_FILE"

          if [ -f "RELEASE_NOTES.md" ]; then
            cat RELEASE_NOTES.md >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          TAG_ANNOTATION=$(git tag -l --format="%(contents)" "$TAG_NAME" 2>/dev/null | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' || true)
          if [ -n "$TAG_ANNOTATION" ] && [ "$TAG_ANNOTATION" != "Release $TAG_NAME" ]; then
            echo "### Overview" >> "$CHANGELOG_FILE"
            echo "$TAG_ANNOTATION" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi

          FEATS=$(git log "$RANGE" --grep="^feat" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          FIXES=$(git log "$RANGE" --grep="^fix" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          PERF=$(git log "$RANGE" --grep="^perf" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          REFACTOR=$(git log "$RANGE" --grep="^refactor" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          CI=$(git log "$RANGE" --grep="^\(ci\|build\)" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)
          OTHERS=$(git log "$RANGE" --invert-grep --grep="^\(feat\|fix\|perf\|refactor\|ci\|build\)" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" || true)

          if [ -n "$FEATS" ]; then
            echo "### ✨ Features & Enhancements" >> "$CHANGELOG_FILE"
            echo "$FEATS" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> "$CHANGELOG_FILE"
            echo "$FIXES" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$PERF" ]; then
            echo "### ⚡ Performance Improvements" >> "$CHANGELOG_FILE"
            echo "$PERF" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$REFACTOR" ]; then
            echo "### ♻️ Code Refactoring" >> "$CHANGELOG_FILE"
            echo "$REFACTOR" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$CI" ]; then
            echo "### 🚀 Build & CI/CD" >> "$CHANGELOG_FILE"
            echo "$CI" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$OTHERS" ] && [ "$OTHERS" != "" ]; then
            echo "### 📦 Other Changes" >> "$CHANGELOG_FILE"
            echo "$OTHERS" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "---" >> "$CHANGELOG_FILE"
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}" >> "$CHANGELOG_FILE"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: "Widgy Release ${{ github.ref_name }}"
          body_path: release-artifacts/RELEASE_CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
